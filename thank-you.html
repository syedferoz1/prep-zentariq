<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Thank you for contacting Zentariq Solutions. We have received your growth enquiry.">
    <title>Thank You | Zentariq Solutions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
            --bg: #010101;
            --text: #f5f3ee;
            --text-soft: rgba(245, 243, 238, 0.72);
            --accent: #ff7f2f;
        }

        * {
            box-sizing: border-box;
        }

        body {
            display: grid;
            min-height: 100vh;
            min-height: 100svh;
            margin: 0;
            padding: 24px;
            place-items: center;
            overflow-x: hidden;
            background:
                radial-gradient(circle at 12% 8%, rgba(255, 127, 47, 0.09), transparent 34%),
                #010101;
            color: var(--text);
            font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
            line-height: 1.5;
        }

        main {
            width: min(100%, 760px);
            padding: clamp(32px, 8vw, 80px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 32px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.035), rgba(255, 255, 255, 0.008));
            box-shadow: 0 26px 80px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .brand {
            display: inline-block;
            width: min(100%, 280px);
            margin-bottom: clamp(42px, 9vw, 76px);
        }

        .brand img {
            display: block;
            width: 100%;
            height: auto;
        }

        .success-mark {
            display: grid;
            width: 64px;
            height: 64px;
            margin: 0 auto 24px;
            place-items: center;
            border: 1px solid rgba(255, 127, 47, 0.5);
            border-radius: 50%;
            background: rgba(255, 127, 47, 0.1);
            color: var(--accent);
            font-size: 1.8rem;
            font-weight: 500;
        }

        .eyebrow {
            margin: 0 0 14px;
            color: var(--accent);
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(2.5rem, 8vw, 5rem);
            font-weight: 500;
            letter-spacing: -0.07em;
            line-height: 1;
        }

        h1 span {
            color: var(--accent);
        }

        .message {
            max-width: 480px;
            margin: 24px auto 36px;
            color: var(--text-soft);
            font-size: clamp(1rem, 2vw, 1.125rem);
        }

        .home-link {
            display: inline-flex;
            min-height: 50px;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 0 22px;
            border: 1px solid var(--accent);
            border-radius: 999px;
            background: var(--accent);
            color: #111;
            font-size: 0.9rem;
            font-weight: 600;
            transition: background 180ms ease, color 180ms ease, transform 180ms ease;
        }

        .home-link:hover {
            transform: translateY(-2px);
            background: transparent;
            color: var(--text);
        }

        .home-link:focus-visible {
            outline: 2px solid var(--text);
            outline-offset: 4px;
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main>
        <a class="brand" href="index.html" aria-label="Zentariq Solutions home">
            <img src="KBQ-assets/branding/zentariq-logo-transparent.png" alt="Zentariq Solutions">
        </a>
        <div class="success-mark" aria-hidden="true">✓</div>
        <p class="eyebrow">Message received</p>
        <h1>Thank <span>you.</span></h1>
        <p class="message">Your growth enquiry has been sent successfully. Our team will review it and get back to you shortly.</p>
        <a class="home-link" href="index.html#lets-talk">Back to Zentariq <span aria-hidden="true">→</span></a>
    </main>
</body>
</html>
