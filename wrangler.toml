name = "zentariq-contact"
main = "src/contact-worker.js"
compatibility_date = "2026-10-08"
workers_dev = false

[[routes]]
pattern = "contact.zentariq.com"
custom_domain = true

[[ratelimits]]
name = "CONTACT_RATE_LIMITER"
namespace_id = "8427301659"

    [ratelimits.simple]
    limit = 5
    period = 60

[vars]
ALLOWED_ORIGIN = "https://prep.zentariq.com"
EMAIL_FROM = "Zentariq Solutions <hello@zentariq.com>"
